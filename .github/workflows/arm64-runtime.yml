name: DeskCue ARM64 hang dump diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    if: github.repository == 'CyberShadowX/DeskCue'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402

      - uses: actions/download-artifact@v4
        with:
          name: deskcue-failure-win-arm64
          run-id: 40536288591
          github-token: ${{ github.token }}
          path: evidence

      - name: Verify native host and exact original dump
        id: dump
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Native ARM64 analysis is required.' }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'global.json'), '{"sdk":{"version":"10.0.402","rollForward":"disable"}}', [Text.UTF8Encoding]::new($false))
          $sdk = & dotnet --version
          if ($LASTEXITCODE -ne 0 -or $sdk.Trim() -ne '10.0.402') { throw 'Selected SDK does not match.' }
          $dumps = @(Get-ChildItem -LiteralPath evidence -Recurse -File -Filter '*.dmp')
          if ($dumps.Count -lt 1) { throw 'Expected an original hang dump.' }
          foreach ($dump in $dumps) {
            $actual = (Get-FileHash -LiteralPath $dump.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne '88f26041b357d8630307810db518f1cdcd322e55cb7a81153fab846cd0f6c32a') { throw 'An original dump copy has a different SHA256.' }
          }
          $selected = $dumps | Sort-Object FullName | Select-Object -First 1
          New-Item -ItemType Directory -Path analysis -Force | Out-Null
          @{ sourceCommit = '6b6195c2be230e6951860ae02c293598d7ecb508'; sourceRun = 40536288591; dumpSha256 = $actual; verifiedDumpCopies = $dumps.Count; sdk = $sdk.Trim(); architecture = 'Arm64' } | ConvertTo-Json | Set-Content -LiteralPath analysis/input.json -Encoding utf8
          "path=$($selected.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install pinned Microsoft dump analyzer
        id: tool
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'deskcue-dump-tools'
          $config = Join-Path $env:RUNNER_TEMP 'deskcue-dump-nuget.config'
          '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>' | Set-Content -LiteralPath $config -Encoding utf8
          & dotnet tool install dotnet-dump --tool-path $toolRoot --version 10.0.750501 --configfile $config
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dump tool installation failed.' }
          $tool = Join-Path $toolRoot 'dotnet-dump.exe'
          $version = & $tool --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '10\.0\.750501') { throw 'Pinned dump tool version differs.' }
          $version | Set-Content -LiteralPath analysis/tool-version.txt -Encoding utf8
          "path=$tool" >> $env:GITHUB_OUTPUT

      - name: Analyze original managed thread stacks
        shell: pwsh
        env:
          DESKCUE_DUMP: ${{ steps.dump.outputs.path }}
          DESKCUE_DUMP_TOOL: ${{ steps.tool.outputs.path }}
        run: |
          $symbols = Join-Path $env:RUNNER_TEMP 'deskcue-dump-symbols'
          New-Item -ItemType Directory -Path $symbols -Force | Out-Null
          $arguments = @('analyze', $env:DESKCUE_DUMP, '-c', "setsymbolserver -ms -cache $symbols", '-c', 'clrthreads', '-c', 'clrstack -all', '-c', 'threadpool', '-c', 'syncblk', '-c', 'exit')
          & $env:DESKCUE_DUMP_TOOL @arguments 2>&1 | Tee-Object -FilePath analysis/managed-stacks.txt | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Dump analysis returned a failure; inspect saved diagnostics.' }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-input
          persist-credentials: false

      - name: Probe original SDK lifecycle in isolated native children
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-input/.github/diagnostics/Probe-EverythingLifecycle.ps1'
          $sdk = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-input/src/DeskCue/ThirdParty/Everything/EverythingARM64.dll'
          if ((Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash -cne 'DC7B8A1FB04F34ECA60EAE940297ED6A7F273C8ACFF369F18579D6D32D4EFA77') { throw 'Reviewed probe script changed.' }
          if ((Get-FileHash -LiteralPath $sdk -Algorithm SHA256).Hash -cne '8531EA393677DD8FD37BED7420AC93344CD458B9A1324BA65C4A75D024D61886') { throw 'Original upstream ARM64 SDK changed.' }
          & $probe -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'diagnostic-input') -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'analysis/native-sdk-lifecycle') -PerProbeSeconds 8
          if ($LASTEXITCODE -ne 0) { throw 'Isolated native SDK probe infrastructure failed.' }

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: deskcue-arm64-hang-analysis
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
          path: analysis/**
